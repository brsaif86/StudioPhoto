name: Build StudioPhoto

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StudioPhoto-windows-x86_64.exe

          - os: macos-13          # Intel x86_64
            artifact: StudioPhoto-macos-intel

          - os: macos-14          # Apple Silicon arm64
            artifact: StudioPhoto-macos-silicon

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install Pillow numpy PySide6 pyinstaller psutil

      # ── Génération icône (si app_icon.png présent) ──────────────────────────
      - name: Generate ICO (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path app_icon.png) { python make_ico.py }

      - name: Generate ICNS (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -f app_icon.png ]; then python make_ico.py; fi

      # ── Build Windows ───────────────────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          $icon_args = if (Test-Path app_icon.ico) { "--icon app_icon.ico --add-data app_icon.ico;." } else { "" }
          $cmd = "python -m PyInstaller --onefile --windowed --name StudioPhoto --add-data core;core --add-data ui;ui $icon_args ui_entry.py"
          Invoke-Expression $cmd

      # ── Build macOS ─────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ICON_ARGS=""
          if [ -f app_icon.ico ]; then
            ICON_ARGS="--icon app_icon.ico --add-data app_icon.ico:."
          elif [ -f app_icon.png ]; then
            ICON_ARGS="--add-data app_icon.png:."
          fi
          python -m PyInstaller \
            --onefile \
            --windowed \
            --name "StudioPhoto" \
            --add-data "core:core" \
            --add-data "ui:ui" \
            $ICON_ARGS \
            ui_entry.py

      # ── Rename & upload ────────────────────────────────────────────────────
      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist\StudioPhoto.exe dist\${{ matrix.artifact }}

      - name: Rename artifact (macOS)
        if: runner.os == 'macOS'
        run: mv dist/StudioPhoto dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 30

  # ── Release GitHub automatique sur tag v* ─────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
