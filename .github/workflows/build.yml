name: Build StudioPhoto

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows-x86_64
            ext: .exe

          - os: macos-13          # Intel x86_64 — seul runner Intel dispo sur GitHub
            artifact_suffix: macos-intel
            ext: ""
            continue_on_error: true

          - os: macos-14          # Apple Silicon arm64
            artifact_suffix: macos-silicon
            ext: ""

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error == true }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install Pillow numpy PySide6 pyinstaller psutil

      # ── Lecture de la version ───────────────────────────────────────────────
      - name: Read version (Windows)
        if: runner.os == 'Windows'
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          echo "APP_VERSION=$v" >> $env:GITHUB_ENV
          echo "EXE_NAME=StudioPhoto-$v-${{ matrix.artifact_suffix }}" >> $env:GITHUB_ENV

      - name: Read version (macOS)
        if: runner.os == 'macOS'
        run: |
          V=$(python -c "from version import __version__; print(__version__)")
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "EXE_NAME=StudioPhoto-${V}-${{ matrix.artifact_suffix }}" >> $GITHUB_ENV

      # ── Génération icône ────────────────────────────────────────────────────
      - name: Generate ICO (Windows)
        if: runner.os == 'Windows'
        run: if (Test-Path app_icon.png) { python make_ico.py }

      - name: Generate ICO (macOS)
        if: runner.os == 'macOS'
        run: if [ -f app_icon.png ]; then python make_ico.py; fi

      # ── Build Windows ───────────────────────────────────────────────────────
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          $buildArgs = @(
            "--onefile", "--windowed",
            "--name", $env:EXE_NAME,
            "--add-data", "core:core",
            "--add-data", "ui:ui",
            "--add-data", "version.py:."
          )
          if (Test-Path app_icon.ico) {
            $buildArgs += "--icon", "app_icon.ico"
            $buildArgs += "--add-data", "app_icon.ico:."
          }
          $buildArgs += "ui_entry.py"
          python -m PyInstaller @buildArgs

      # ── Build macOS ─────────────────────────────────────────────────────────
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ICON_ARGS=""
          if [ -f app_icon.ico ]; then
            ICON_ARGS="--icon app_icon.ico --add-data app_icon.ico:."
          fi
          python -m PyInstaller \
            --onefile \
            --windowed \
            --name "$EXE_NAME" \
            --add-data "core:core" \
            --add-data "ui:ui" \
            --add-data "version.py:." \
            $ICON_ARGS \
            ui_entry.py

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}${{ matrix.ext }}
          path: dist/${{ env.EXE_NAME }}${{ matrix.ext }}
          retention-days: 30

  # ── Release GitHub automatique sur tag v* ─────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
